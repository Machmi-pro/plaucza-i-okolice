# Publikuje stronę (index.html, app.js, style.css z katalogu głównego) z danymi (data/) na GitHub Pages; makieta trafia pod /makieta/.
# Uruchamia się po każdej zmianie na gałęzi main albo ręcznie (Actions > Run workflow).
name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Przygotuj stronę
        run: |
          mkdir -p _site
          cp index.html app.js style.css _site/
          cp -r data _site/data
          mkdir -p _site/makieta
          cp -r mockup/. _site/makieta/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
